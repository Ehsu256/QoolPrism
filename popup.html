<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QoolPrism</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="header">
      <img class="icon" src="icon.png" alt="">
      <h1>QoolPrism</h1>
    </header>

    <main>
      <form id="server-form">
        <label for="server-url">PhotoPrism server URL</label>
        <input
          id="server-url"
          name="server-url"
          type="url"
          placeholder="https://123.456.78.9:2342"
          autocomplete="url"
          required
        >
        <div class="button-row">
          <button id="save-button" type="submit">Save server URL</button>
          <button id="clear-button" class="secondary-button" type="button">Remove server URL</button>
        </div>
      </form>

      <div id="server-box" class="info-box" role="status" aria-live="polite"></div>

      <details class="options">
        <summary>Options</summary>
        <label class="option" for="key-badges-option">
          <input id="key-badges-option" type="checkbox" checked>
          Show keybind bubbles
        </label>
      </details>
    </main>
    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
