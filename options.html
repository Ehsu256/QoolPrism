<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QoolPrism</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <h1>QoolPrism</h1>

      <form id="server-form">
        <label for="server-url">PhotoPrism server URL</label>
        <input
          id="server-url"
          name="server-url"
          type="url"
          placeholder="https://123.456.78.9:2342"
          autocomplete="url"
          required
        >
        <button id="save-button" type="submit">Save server</button>
      </form>

      <section id="configured-server" class="configured-server" hidden>
        <h2>Configured server</h2>
        <p id="server-status"></p>
        <button id="clear-button" class="secondary-button" type="button">Remove server</button>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script src="common.js"></script>
    <script src="options.js"></script>
  </body>
</html>
